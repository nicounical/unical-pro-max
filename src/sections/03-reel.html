<section class="opt-sec" id="showreel" data-sec="reel" data-label="Showreel">

  <!-- A · Ventana editorial (conservada): el vídeo empieza como una ventana dentro de la retícula y crece con el scroll (sin pin). Ronda 5: vídeo nuevo, sin sonido -->
  <div class="variant reel-a" data-v="A" data-name="Ventana editorial" data-theme="light">
    <div class="wrap reel-a__in">
      <header class="reel-a__head">
        <p class="mono reel-a__kicker">(Showreel 2026) <span>· 0:40</span></p>
        <h2 class="reel-a__title">Imprimimos, rotulamos, montamos e instalamos. <span class="acc">Así se ve.</span></h2>
      </header>
      <div class="reel-a__stage">
        <div class="reel-a__frame" data-player>
          <video src="assets/video/showreel.mp4" data-src-m="assets/video/showreel-720.mp4" poster="assets/video/showreel.webp" muted loop playsinline preload="none" aria-label="Showreel de Unical Graphic: montaje de proyectos reales"></video>
        </div>
      </div>
      <div class="reel-a__bar">
        <div class="reel-ctl" data-ctl>
          <button type="button" class="reel-ctl__b" data-play><span>Reproducir</span></button>
          <span class="mono reel-ctl__tc" aria-hidden="true"><b data-tc>00:00</b> / <span data-dur>00:40</span></span>
        </div>
        <p class="reel-a__note">Montaje de proyectos reales, producidos e instalados por nuestro equipo.</p>
        <button type="button" class="reel-a__full" data-reel>Pantalla completa <span aria-hidden="true">↗</span></button>
      </div>
    </div>
  </div>
</section>
